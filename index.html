<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retour à l'envoyeur</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280; --border:#d7dbe0;
    --accent:#4f46e5; --accent-ink:#ffffff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#111317; --card:#1a1d22; --text:#f2f3f5; --muted:#9aa1ab; --border:#3a3f47; }
  }
  :root[data-theme="dark"]{ --bg:#111317; --card:#1a1d22; --text:#f2f3f5; --muted:#9aa1ab; --border:#3a3f47; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  *{ box-sizing:border-box; }
  body{ height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main{ max-width:480px; margin:0 auto; padding:24px 16px 40px; }
  .progress{ color:var(--muted); font-size:.78rem; text-align:center; margin-bottom:6px; }
  h1{ font-size:1.15rem; margin:4px 0 18px; text-align:center; }
  section.card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .opt{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .opt.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .opt-text{ font-size:.95rem; }
  .badge{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; color:var(--muted); }
  .opt.on .badge{ border-color:var(--accent); background:var(--accent); color:#fff; }
  textarea{ width:100%; margin-top:14px; min-height:60px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font:inherit; resize:vertical; }
  button#next{ width:100%; margin-top:14px; background:var(--accent); color:var(--accent-ink); font-weight:600;
    border:none; border-radius:10px; padding:13px 16px; font-size:1rem; cursor:pointer; }
  button#next:disabled{ opacity:.5; }
  #hint{ text-align:center; color:#ef4444; font-size:.85rem; height:1.2em; margin-top:8px; }
  .thanks{ text-align:center; padding:30px 10px; }
  .thanks .big{ font-size:2rem; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <!-- ====== PERSONNALISATION : modifie librement les titres et les réponses de chaque page ====== -->
  <script id="config">
    window.PAGES = [
      { question: "Quand tu imagines qu'on recommence à se parler régulièrement - pas juste deux messages diplomatiques tous les quatre jours — quelle réaction ressemble le plus à la tienne ?", options: ["Ça me ferait surtout du bien qu'on garde encore de la distance.","Ça me ferait plaisir, mais j'aurais besoin que ce soit léger et progressif.","J'en ai envie, mais il y a encore des choses importantes à éclaircir.","Oui. J'ai vraiment envie qu'on retrouve une place régulière dans la vie de l'autre.","Je ne sais pas encore — et c'est justement pour ça que j'ai besoin qu'on parle."] },
      { question: "Avec le recul, le temps et la distance, qu'est-ce qui s'est surtout clarifié pour toi ?", options: ["Ce qui me faisait du mal dans notre relation.","Ce que j'aurais aimé qu'on fasse différemment.","Les choses chez toi auxquelles je tiens vraiment.","Les choses chez moi que je dois aussi remettre en question.","Certains de nos problèmes me paraissent aujourd'hui réparables.","Certaines incompatibilités me semblent au contraire plus importantes qu'avant.","Je suis encore en plein brouillard."] },
      { question: "Quand tu repenses à moi avec affection — si ça t'arrive encore, madame — qu'est-ce qui fait que je peux te manquer ?", options: ["Notre complicité / nos private jokes.","Les conversations qu'on peut avoir pendant des heures.","La façon dont on se comprend.","Notre attirance / notre tendresse.","Les projets et la vie que j'arrivais a imaginer avec toi.","Le fait qu'on se pousse mutuellement à évoluer.","Le sentiment d'être chez moi avec toi.","Ton énergie / ta personnalité.","Des souvenirs précis qui me reviennent."] },
      { question: "Si on envisageait réellement un jour de construire à nouveau quelque chose - jusqu'au scénario très légèrement ambitieux de te passer une bague au doigt - qu'est-ce que tu aurais surtout besoin de voir chez moi pour te sentir rassuré ?", options: ["Plus de stabilité / constance.","Une meilleure communication dans les moments difficiles.","Que certaines blessures ou certains comportements ne se répètent pas.","Plus de confiance.","Que nos projets de vie soient réellement compatibles.","Que je sache davantage respecter tes besoins / ton espace.","Voir comment notre relation fonctionnerait concrètement, pas seulement émotionnellement."] }
    ];
  </script>
  <!-- ============================================================================================ -->

  <div class="progress" id="progress"></div>
  <h1 id="qTitle"></h1>

  <section class="card" id="formCard">
    <div id="options"></div>
    <textarea id="comment" placeholder="Commentaire personnel (optionnel)"></textarea>
    <button id="next"></button>
    <div id="hint"></div>
  </section>

  <section class="card thanks" id="thanksCard" style="display:none">
    <div class="big">✓</div>
    <div>Merci, c'est envoyé.</div>
  </section>
</main>

<script>
// ÉTAPE 1 (temporaire) : adresse en clair pour déclencher l'activation de ce site.
const FORM_ENDPOINT = "https://formsubmit.co/igor.delarueducan@yahoo.fr";
const PAGES = window.PAGES;
let page = 0;
const answers = PAGES.map(() => ({ selections: [], comment: '' }));

const progressEl = document.getElementById('progress');
const titleEl = document.getElementById('qTitle');
const optionsEl = document.getElementById('options');
const commentEl = document.getElementById('comment');
const nextBtn = document.getElementById('next');
const hintEl = document.getElementById('hint');

function render(){
  const p = PAGES[page];
  progressEl.textContent = `Question ${page+1} / ${PAGES.length}`;
  titleEl.textContent = p.question;
  commentEl.value = answers[page].comment;
  nextBtn.textContent = page === PAGES.length - 1 ? 'Envoyer' : 'Suivant';
  hintEl.textContent = '';

  optionsEl.innerHTML = '';
  p.options.forEach((opt, i) => {
    const rank = answers[page].selections.indexOf(i);
    const row = document.createElement('div');
    row.className = 'opt' + (rank > -1 ? ' on' : '');
    row.innerHTML = `<span class="opt-text">${opt}</span><span class="badge">${rank > -1 ? rank+1 : ''}</span>`;
    row.addEventListener('click', () => {
      const sels = answers[page].selections;
      const idx = sels.indexOf(i);
      if (idx > -1) sels.splice(idx, 1); else sels.push(i);
      render();
    });
    optionsEl.appendChild(row);
  });
}
render();

commentEl.addEventListener('input', () => { answers[page].comment = commentEl.value; });

nextBtn.addEventListener('click', () => {
  if (answers[page].selections.length === 0){
    hintEl.textContent = 'Choisis au moins une réponse';
    return;
  }
  if (page < PAGES.length - 1){
    page++;
    render();
    return;
  }
  let body = "Retour à l'envoyeur\n\n";
  PAGES.forEach((p, pi) => {
    const chosen = answers[pi].selections.map((optIdx, rank) => `${rank+1}. ${p.options[optIdx]}`).join('\n');
    body += `${p.question}\n${chosen}\n`;
    if (answers[pi].comment.trim()) body += `Commentaire : ${answers[pi].comment.trim()}\n`;
    body += '\n';
  });
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = FORM_ENDPOINT;
  const msgInput = document.createElement('input');
  msgInput.type = 'hidden'; msgInput.name = 'message'; msgInput.value = body;
  const subjInput = document.createElement('input');
  subjInput.type = 'hidden'; subjInput.name = '_subject'; subjInput.value = "Retour à l'envoyeur — nouvelle réponse";
  form.appendChild(msgInput); form.appendChild(subjInput);
  document.body.appendChild(form);
  form.submit();
});
</script>
</body>
</html>
